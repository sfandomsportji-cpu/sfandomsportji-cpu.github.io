<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>SFANDOM · Judge Signature Moment</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#050505;color:#fff;font-family:Inter,Arial,sans-serif}.wrap{width:min(1180px,calc(100% - 28px));margin:0 auto;padding:28px 0 56px}.stage{border:1px solid #29292d;background:#000;overflow:hidden}.bar{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;background:#070709}.brand{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:900;letter-spacing:.2em}.brand img{width:30px;height:30px;object-fit:contain}.identity{font-size:10px;font-weight:800;letter-spacing:.13em;color:#aaa}.identity b{color:#ef2d35}.screen{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden}.screen video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;opacity:0;transition:opacity .35s ease}.screen video.ready{opacity:1}.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(0deg,rgba(0,0,0,.62),transparent 38%)}.copy{position:absolute;left:18px;bottom:20px;z-index:2}.copy h1{margin:0;font-size:clamp(34px,7vw,76px);line-height:.87;letter-spacing:-.06em;text-shadow:0 4px 24px rgba(0,0,0,.78)}.copy p{margin:11px 0 0;color:#c4c4c8;font-size:11px;font-weight:700}.watermark{position:absolute;right:14px;bottom:14px;z-index:3;width:46px;height:46px;padding:6px;background:rgba(5,5,5,.64);border:1px solid rgba(255,255,255,.12)}.watermark img{width:100%;height:100%;object-fit:contain}.fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;color:#777;font-size:12px;line-height:1.7;letter-spacing:.05em}.fallback strong{display:block;color:#fff;margin-bottom:8px}.rule{height:3px;background:#18181b}.rule i{display:block;width:30%;height:100%;background:#ef2d35}@media(max-width:620px){.wrap{width:calc(100% - 18px);padding-top:14px}.bar{padding:14px}.identity{max-width:58%;text-align:right}.copy{left:12px;bottom:14px}.copy h1{font-size:clamp(30px,10vw,52px)}.watermark{right:9px;bottom:10px;width:40px;height:40px}}
</style>
</head>
<body>
<main class="wrap">
  <section class="stage">
    <div class="bar"><div class="brand"><img src="assets/sfandom-logo-official.png" alt=""><span>SFANDOM</span></div><div class="identity">MOMENTS THAT MATTER · <b>VERIFIED BY DATA</b></div></div>
    <div class="screen">
      <div id="fallback" class="fallback"><div><strong>저지 300호 실제 경기 장면을 준비하는 중</strong></div></div>
      <video id="player" autoplay muted playsinline preload="auto"></video>
      <div class="shade"></div>
      <div class="copy"><h1>JUDGE<br>300 HR</h1><p>Fastest to 300 career home runs · August 14, 2024</p></div>
      <div class="watermark"><img src="assets/sfandom-logo-official.png" alt=""></div>
    </div>
    <div class="rule"><i></i></div>
  </section>
</main>
<script>
(async()=>{
  const START_AT=0.15;
  const player=document.getElementById('player'),fallback=document.getElementById('fallback');
  const norm=s=>(s||'').trim().toLowerCase().replace(/[’‘]/g,"'").replace(/[–—]/g,'-').replace(/\s+/g,' ');
  function tags(item){return (item.keywordsAll||[]).map(x=>norm(x.displayName||x.value||x.name)).join(' | ')}
  function choosePlayback(item){const all=(item.playbacks||[]).filter(p=>p&&p.url),mp4=all.filter(p=>/\.mp4(?:\?|$)/i.test(p.url)),pool=mp4.length?mp4:all;pool.sort((a,b)=>((b.width||0)*(b.height||0))-((a.width||0)*(a.height||0)));return pool[0]}
  try{
    const sr=await fetch('https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=2024-08-14',{mode:'cors',cache:'no-store'});
    if(!sr.ok)throw new Error('schedule HTTP '+sr.status);
    const sd=await sr.json();
    const games=(sd.dates||[]).flatMap(d=>d.games||[]);
    const game=games.find(g=>g.teams?.away?.team?.id===147&&g.teams?.home?.team?.id===145);
    if(!game)throw new Error('game not found');
    const r=await fetch(`https://statsapi.mlb.com/api/v1/game/${game.gamePk}/content`,{mode:'cors',cache:'no-store'});
    if(!r.ok)throw new Error('content HTTP '+r.status);
    const data=await r.json();
    const items=data?.highlights?.highlights?.items||[];
    const candidates=items.filter(x=>{
      const t=norm(x.title),k=tags(x);
      const titleOk=t==="aaron judge's 300th career homer (43)"||(t.includes('aaron judge')&&t.includes('300th career homer'));
      const inGame=k.includes('in-game highlight');
      const banned=k.includes('interview')||k.includes('exclusive angle')||k.includes('statcast')||k.includes('data visualization')||t.includes('field view')||t.includes('curtain call')||t.includes('radio call')||t.includes('all 300');
      return titleOk&&inGame&&!banned;
    });
    if(candidates.length!==1)throw new Error('exact highlight count '+candidates.length);
    const playback=choosePlayback(candidates[0]);
    if(!playback?.url)throw new Error('video URL not found');
    player.src=playback.url;
    player.addEventListener('loadedmetadata',()=>{
      if(Number.isFinite(player.duration)&&player.duration>START_AT+1) player.currentTime=START_AT;
    },{once:true});
    player.addEventListener('seeked',()=>{
      fallback.style.display='none';
      player.classList.add('ready');
      player.play().catch(()=>{});
    },{once:true});
    player.addEventListener('ended',()=>{
      player.currentTime=START_AT;
      player.play().catch(()=>{});
    });
    player.addEventListener('error',()=>{fallback.innerHTML='<div><strong>경기 영상 로드 실패</strong></div>';});
  }catch(e){fallback.innerHTML='<div><strong>경기 영상 선택 실패</strong>'+String(e.message||e)+'</div>';}
})();
</script>
</body>
</html>
