name: One-time mobile audio cache bust

on:
  push:
    paths:
      - '.github/workflows/cachebust-mobile-audio.yml'

permissions:
  contents: write

jobs:
  fix-home-script-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update homepage script cache key
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'music-player.js?v=20260826-no-music1'
          new = 'music-player.js?v=20260826-no-music4'
          if old not in s:
              raise SystemExit('old cache key not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          rm -f .github/workflows/cachebust-mobile-audio.yml
          git config user.name "sfandom-maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/cachebust-mobile-audio.yml
          git commit -m "Bust homepage mobile audio cache"
          git push
