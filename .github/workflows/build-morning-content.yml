name: Build approved Aug 30 morning content

on:
  push:
    branches:
      - content/morning-20260830-approved
    paths:
      - .github/workflows/build-morning-content.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved branch
        uses: actions/checkout@v4
        with:
          ref: content/morning-20260830-approved
          fetch-depth: 1
      - name: One-to-one replacement and archive verification
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/build_morning_20260830.py
          echo 'OLD MAIN RESIDUE'
          ! grep -nE '37세의 100\.1마일|Chourio의 4안타|No Fireballs|Mize vs McClanahan|TAMPA BAY ML|morning-20260829/chris-sale' index.html
          echo 'ARCHIVE RETENTION'
          grep -n 'ARCHIVE 05 · COMPLETE' archive/media/index.html
          grep -n 'TAMPA BAY ML' archive/media/index.html
          test -s archive/snapshots/2026-08-29-main-fragment.html
          echo 'NEW CONTENT'
          grep -nE '160\.3km|토트넘의 새 출발|Three Swings|Sánchez vs Johnson|NO PICK · PASS' index.html
          echo 'NEW IMAGES'
          for p in assets/morning-20260830/*; do
            test -s "$p"
            file "$p"
          done
      - name: Commit clean replacement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish approved Aug 30 content with exact prior snapshot'
          git push origin HEAD:content/morning-20260830-approved
