name: Probe KBO/NPB sources (일회성 점검)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: probe-sources
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python3 src/tools/probe_sources.py
      - name: Commit samples
        run: |
          git config user.name "sfandom-bot"
          git config user.email "sfandom-bot@users.noreply.github.com"
          git add src/probe
          git diff --cached --quiet && exit 0
          git commit -m "probe: KBO·NPB 자료원 견본 저장"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; done
          exit 1
