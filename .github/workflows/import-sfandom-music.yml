name: Import SFANDOM R&B Music

on:
  push:
    paths:
      - '.github/workflows/import-sfandom-music.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-music:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download approved Pixabay R&B tracks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.parse import urlparse
          import html as htmlmod
          import json, re, time

          tracks = [
              {
                  'file': 'sfandom-rnb-01-smooth-rnb-beat.mp3',
                  'title': 'Smooth Rnb Beat',
                  'artist': 'Tunetank',
                  'page': 'https://pixabay.com/music/beats-smooth-rnb-beat-409348/'
              },
              {
                  'file': 'sfandom-rnb-02-modern-rnb.mp3',
                  'title': 'Modern R&B',
                  'artist': '-SunSet-',
                  'page': 'https://pixabay.com/music/beats-modern-rampb-550856/'
              },
              {
                  'file': 'sfandom-rnb-03-private-thoughts.mp3',
                  'title': 'Private Thoughts - Chill Late Night Trapsoul Instrumental',
                  'artist': 'JayStacksBeats',
                  'page': 'https://pixabay.com/music/funk-private-thoughts-chill-late-night-trapsoul-instrumental-462717/'
              },
              {
                  'file': 'sfandom-rnb-04-low-glow.mp3',
                  'title': 'Low Glow - Warm R&B Chill for Relaxed Focus',
                  'artist': 'OpenUseMusic',
                  'page': 'https://pixabay.com/music/rnb-low-glow-warm-rampb-chill-for-relaxed-focus-460279/'
              },
          ]

          outdir = Path('assets/music')
          outdir.mkdir(parents=True, exist_ok=True)

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept-Language': 'en-US,en;q=0.9',
          }

          def fetch_text(url):
              req = Request(url, headers=headers)
              with urlopen(req, timeout=45) as r:
                  return r.read().decode('utf-8', 'replace')

          def walk(obj):
              if isinstance(obj, dict):
                  u = obj.get('contentUrl')
                  if isinstance(u, str) and '.mp3' in u:
                      p = urlparse(u)
                      if p.scheme == 'https' and p.netloc == 'cdn.pixabay.com' and '/audio/' in p.path:
                          return u
                  for v in obj.values():
                      hit = walk(v)
                      if hit:
                          return hit
              elif isinstance(obj, list):
                  for v in obj:
                      hit = walk(v)
                      if hit:
                          return hit
              return None

          def extract_content_url(doc):
              scripts = re.findall(r'<script[^>]*type=["\']application/ld\+json["\'][^>]*>(.*?)</script>', doc, flags=re.I|re.S)
              for raw in scripts:
                  raw = htmlmod.unescape(raw).strip()
                  try:
                      data = json.loads(raw)
                  except Exception:
                      continue
                  hit = walk(data)
                  if hit:
                      return hit
              raise RuntimeError('Pixabay MP3 contentUrl not found in JSON-LD')

          manifest = []
          for t in tracks:
              print('Resolving', t['title'])
              page_html = fetch_text(t['page'])
              mp3_url = extract_content_url(page_html)
              dest = outdir / t['file']
              print('Downloading', mp3_url)
              req = Request(mp3_url, headers=headers)
              with urlopen(req, timeout=120) as r, dest.open('wb') as f:
                  while True:
                      chunk = r.read(1024 * 1024)
                      if not chunk:
                          break
                      f.write(chunk)
              if dest.stat().st_size < 100000:
                  raise RuntimeError(f'Download too small: {dest} ({dest.stat().st_size} bytes)')
              manifest.append({
                  'file': str(dest),
                  'title': t['title'],
                  'artist': t['artist'],
                  'source_page': t['page'],
                  'license': 'Pixabay Content License',
                  'license_url': 'https://pixabay.com/service/license-summary/'
              })
              time.sleep(1)

          (outdir / 'sources.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit music files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/music
          if git diff --cached --quiet; then
            echo 'Music files already up to date.'
          else
            git commit -m 'Add approved SFANDOM R&B background music'
            git pull --rebase origin main
            git push origin main
          fi
