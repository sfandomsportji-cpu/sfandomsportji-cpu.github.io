name: Purge Home Picks Once
on:
  push:
    branches: [fix/purge-legacy-mascot-home-stability-20260828]
    paths: ['.github/workflows/purge-home-picks-once.yml']
permissions:
  contents: write
jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/purge-legacy-mascot-home-stability-20260828
      - name: Remove homepage pick runtime and self-delete
        shell: python
        run: |
          from pathlib import Path
          import re

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          pattern = r'\n    <section class="section home-picks reveal"[\s\S]*?\n    </section>\n'
          html, count = re.subn(pattern, '\n', html, count=1)
          if count != 1:
              raise SystemExit(f'expected one home-picks section, removed {count}')
          html = html.replace('home.css?v=20260828-stable2', 'home.css?v=20260828-stable3')
          if 'home-picks' in html or 'home-pick-board' in html:
              raise SystemExit('homepage pick markup still remains')
          index.write_text(html, encoding='utf-8')

          css_path = Path('home.css')
          lines = css_path.read_text(encoding='utf-8').splitlines(keepends=True)
          cleaned = ''.join(line for line in lines if 'home-pick' not in line)
          if 'home-pick' in cleaned:
              raise SystemExit('homepage pick CSS still remains')
          css_path.write_text(cleaned, encoding='utf-8')

          wf = Path('.github/workflows/purge-home-picks-once.yml')
          wf.unlink()
      - name: Commit cleaned source
        run: |
          git config user.name "sfandomsportji-cpu"
          git config user.email "sfandomsportji@gmail.com"
          git add -A
          git diff --cached --exit-code && exit 1 || true
          git commit -m "Remove retired homepage pick code"
          git push origin HEAD:fix/purge-legacy-mascot-home-stability-20260828
