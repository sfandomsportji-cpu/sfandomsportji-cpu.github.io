name: NBA injury monitor (audit-only; 10-minute checks)

# The schedule becomes active ONLY after an approved merge to the default branch.
# No site build, no source edits, no publication, no push, no code mutation.
on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *" # UTC; KST is UTC+9
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/nba-injury-watch.yml"
      - "src/tools/nba_injury_monitor.py"
      - "src/tools/injury_failover.py"
      - "src/tools/injury_quality.py"
      - "src/tools/sports_clock.py"
      - "tests/test_nba_injury_monitor.py"
      - "tests/test_injury_quality.py"
      - "tests/test_sports_clock.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: nba-injury-watch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Offline timezone + status safety tests
        run: python -m unittest discover -s tests -p "test_nba_injury_monitor.py" -v && python -m unittest discover -s tests -p "test_injury_quality.py" -v && python -m unittest discover -s tests -p "test_sports_clock.py" -v

  monitor:
    if: github.event_name != 'pull_request'
    needs: [unit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pinned PDF parser
        run: python -m pip install pdfplumber==0.11.7
      - name: Restore last successful audit artifact if available
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          mkdir -p .monitor
          set +e
          ids=$(gh run list --workflow nba-injury-watch.yml --status success --limit 12 --json databaseId --jq '.[].databaseId')
          if [ -n "$ids" ]; then
            while IFS= read -r id; do
              [ -n "$id" ] || continue
              mkdir -p .monitor/from-artifact
              gh run download "$id" -n nba-injury-state -D .monitor/from-artifact >/dev/null 2>&1
              if [ -f .monitor/from-artifact/current.json ]; then
                cp .monitor/from-artifact/current.json .monitor/previous.json
                echo "Previous audit snapshot restored from workflow run $id"
                break
              fi
            done <<< "$ids"
          fi
          exit 0
      - name: Fetch official PDF; second URL; cached fallback
        id: run
        shell: bash
        run: |
          if python src/tools/nba_injury_monitor.py \
                 --previous .monitor/previous.json \
                 --output .monitor/current.json \
                 --changes .monitor/changes.json; then
            echo "result=verified" >> "$GITHUB_OUTPUT"
          else
            python src/tools/injury_failover.py \
                 --previous .monitor/previous.json \
                 --output .monitor/current.json \
                 --incident .monitor/incident.json
            echo "result=stale" >> "$GITHUB_OUTPUT"
          fi
      - name: Audit artifact only (not website)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nba-injury-state
          path: |
            .monitor/current.json
            .monitor/changes.json
            .monitor/incident.json
          if-no-files-found: warn
          retention-days: 2
      - name: Flag monitored schedule gaps (over 22 minutes)
        if: steps.run.outputs.result == 'verified'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s = json.loads(Path(".monitor/current.json").read_text(encoding="utf-8"))
          if s.get("schedule_gap_alert") is True:
              print("::warning::NBA monitor gap exceeds 22 minutes; audit coverage is incomplete. New report was freshly verified but changes require review.")
          if s.get("review_required") is True:
              print("::notice::NBA data remains NOT_APPROVED pending operator review.")
          PY
      - name: Surface failure in GitHub Actions
        if: steps.run.outputs.result == 'stale'
        run: |
          echo "::error::Official NBA report could not be verified; retained last known state only, blocked publication."
          exit 1
