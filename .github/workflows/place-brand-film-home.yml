name: Place Brand Film on Home Hero

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/place-brand-film-home.yml'

permissions:
  contents: write

jobs:
  patch-home:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch homepage hero
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<article class="glass-card forecast-card">'
          start=s.find(marker)
          if start < 0:
              raise SystemExit('forecast card marker not found')
          end=s.find('</article>',start)
          if end < 0:
              raise SystemExit('forecast card closing tag not found')
          end += len('</article>')
          replacement=base64.b64decode('').decode('utf-8')
          s=s[:start]+replacement+s[end:]
          s=s.replace('home.css?v=20260829-mobile1','home.css?v=20260902-brandfilm1')
          p.write_text(s,encoding='utf-8')
          css=Path('home.css')
          c=css.read_text(encoding='utf-8')
          cssblock=base64.b64decode('').decode('utf-8')
          if '/* 2026-09-02 · home hero brand film */' not in c:
              c += cssblock
          css.write_text(c,encoding='utf-8')
          PY

      - name: Commit changes and remove one-time workflow
        run: |
          rm .github/workflows/place-brand-film-home.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html home.css .github/workflows/place-brand-film-home.yml
          git commit -m "Place SFANDOM brand film on homepage hero"
          git push
