name: Add Featured Instagram Reel

on:
  push:
    paths:
      - '.github/workflows/add-featured-reel.yml'

permissions:
  contents: write

jobs:
  update-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add featured reel section
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if 'id="featured-reel-20260821"' not in s:
              marker = '    <section class="section promise reveal">'
              block = '''    <section id="featured-reel-20260821" class="section reveal" aria-labelledby="featured-reel-title" style="padding-top:24px;padding-bottom:104px;">
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));align-items:center;gap:clamp(36px,7vw,96px);padding:clamp(22px,4vw,42px);border:1px solid #282828;background:linear-gradient(135deg,#090909 0%,#050505 58%,#120607 100%);overflow:hidden;">
        <div style="width:min(100%,420px);margin:0 auto;position:relative;">
          <div style="position:absolute;inset:-1px;pointer-events:none;border-top:3px solid #e5262b;z-index:2;"></div>
          <div style="position:relative;width:100%;aspect-ratio:9/16;background:#000;border:1px solid #2c2c2c;overflow:hidden;">
            <iframe
              src="https://www.instagram.com/reel/DcSS7W5yI80/embed/"
              title="SFANDOM MLB Daily Highlights — 2026.08.21"
              loading="lazy"
              allowfullscreen
              scrolling="no"
              frameborder="0"
              style="position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;">
            </iframe>
          </div>
          <div style="display:flex;justify-content:space-between;gap:14px;padding-top:12px;font-size:.72rem;letter-spacing:.1em;color:#858585;">
            <span>SFANDOM · REEL</span><span>2026.08.21 KST</span>
          </div>
        </div>

        <div style="max-width:620px;">
          <p class="eyebrow">FEATURED REEL</p>
          <h2 id="featured-reel-title" style="margin:10px 0 22px;font-size:clamp(2.25rem,5vw,5.4rem);line-height:.91;letter-spacing:-.055em;">MLB DAILY<br><span style="color:#ef2d2d;">HIGHLIGHTS.</span></h2>
          <p style="margin:0 0 12px;font-size:clamp(1rem,1.5vw,1.2rem);font-weight:700;color:#f4f4f4;">FIVE GAMES. ONE MINUTE.</p>
          <p style="max-width:520px;margin:0 0 28px;color:#a7a7a7;line-height:1.8;">하루의 핵심 경기 장면을 빠르게 묶어 보는 SFANDOM 하이라이트. 경기 결과와 흐름을 길게 설명하기보다, 중요한 순간만 짧고 선명하게 보여줍니다.</p>
          <div style="display:flex;gap:12px;flex-wrap:wrap;">
            <a class="btn primary" href="https://www.instagram.com/reel/DcSS7W5yI80/" target="_blank" rel="noopener noreferrer">Instagram에서 보기 <b>↗</b></a>
            <a class="btn ghost" href="content.html">콘텐츠 더 보기</a>
          </div>
        </div>
      </div>
    </section>

'''
              if marker not in s:
                  raise SystemExit('Insertion marker not found')
              s = s.replace(marker, block + marker, 1)
              p.write_text(s, encoding='utf-8')

          git_marker = Path('.featured-reel-applied')
          git_marker.write_text('DcSS7W5yI80\n', encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .featured-reel-applied
          if git diff --cached --quiet; then
            echo 'No homepage changes needed.'
          else
            git commit -m 'Add featured MLB Daily Highlights reel to homepage'
            git push
          fi
