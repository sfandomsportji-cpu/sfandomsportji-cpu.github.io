name: Deploy visitor counter Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'counter-worker/**'
      - '.github/workflows/deploy-counter-worker.yml'

permissions:
  contents: read

concurrency:
  group: sfandom-visitor-counter-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: counter-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VISITOR_HASH_SECRET: ${{ secrets.VISITOR_HASH_SECRET }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -n "$VISITOR_HASH_SECRET" || { echo 'Missing VISITOR_HASH_SECRET'; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy Worker and custom domain
        run: npx --yes wrangler@4 deploy

      - name: Store visitor hash secret
        shell: bash
        run: printf '%s' "$VISITOR_HASH_SECRET" | npx --yes wrangler@4 secret put VISITOR_HASH_SECRET

      - name: Verify health endpoint
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors \
            https://counter.sfandom.com/health

      - name: Verify counter storage endpoint
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors \
            -H 'Origin: https://sfandom.com' \
            https://counter.sfandom.com/v1/count
