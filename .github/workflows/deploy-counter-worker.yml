name: Deploy visitor counter Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'counter-worker/**'
      - '.github/workflows/deploy-counter-worker.yml'

permissions:
  contents: read

concurrency:
  group: sfandom-visitor-counter-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: counter-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Deploy Worker and custom domain
        run: npx --yes wrangler@4 deploy

      - name: Ensure visitor hash secret exists
        shell: bash
        run: |
          if npx --yes wrangler@4 secret list --format json | grep -q 'VISITOR_HASH_SECRET'; then
            echo 'VISITOR_HASH_SECRET already configured'
          else
            secret_value="$(openssl rand -hex 32)"
            printf '%s' "$secret_value" | npx --yes wrangler@4 secret put VISITOR_HASH_SECRET
            unset secret_value
          fi

      - name: Verify health endpoint
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors \
            https://counter.sfandom.com/health

      - name: Verify counter storage endpoint
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors \
            -H 'Origin: https://sfandom.com' \
            https://counter.sfandom.com/v1/count
