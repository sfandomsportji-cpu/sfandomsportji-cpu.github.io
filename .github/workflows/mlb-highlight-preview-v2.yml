name: MLB highlight preview v2

on:
  push:
    branches: [mlb-highlight-2026-09-03]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MLB_DATE: '2026-09-02'
      MAX_CLIPS: '7'
      SEGMENT_SECONDS: '6'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer dependencies
        run: |
          python -m pip install --quiet requests
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Fetch official MLB clips and render 9x16 MP4
        shell: bash
        run: |
          cat > /tmp/render.py <<'PY'
          import json, os, re, shlex, subprocess, time
          from pathlib import Path
          import requests

          DATE=os.environ['MLB_DATE']; MAX=int(os.environ['MAX_CLIPS']); DUR=float(os.environ['SEGMENT_SECONDS'])
          W=Path('/tmp/mlb'); RAW=W/'raw'; SEG=W/'seg'; OUT=Path('dist')/f'sfandom_mlb_highlights_{DATE}.mp4'
          for p in (RAW,SEG,OUT.parent): p.mkdir(parents=True,exist_ok=True)
          S=requests.Session(); S.headers.update({'User-Agent':'SFANDOM-MLB-Highlight-Renderer/1.0','Referer':'https://www.mlb.com/'})
          FONT='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'; FONT2='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'

          def get(url,**params):
              r=S.get(url,params=params or None,timeout=30); r.raise_for_status(); return r.json()
          def secs(v):
              if v is None:return None
              if isinstance(v,(int,float)):return float(v)
              try:
                  a=[float(x) for x in str(v).split(':')]
                  return a[-1]+(a[-2]*60 if len(a)>1 else 0)+(a[-3]*3600 if len(a)>2 else 0)
              except:return None
          def walk(x):
              if isinstance(x,dict):
                  if x.get('title') and isinstance(x.get('playbacks'),list): yield x
                  for v in x.values(): yield from walk(v)
              elif isinstance(x,list):
                  for v in x: yield from walk(v)
          def pb(item):
              a=[p for p in item.get('playbacks',[]) if '.mp4' in str(p.get('url','')).lower()]
              def q(p):
                  n=str(p.get('name','')); m=re.search(r'(\d{3,4})x(\d{3,4})',n); return int(m.group(1)) if m else 0
              return max(a,key=q) if a else None
          def score(item):
              t=(str(item.get('title',''))+' '+str(item.get('blurb',''))).lower(); s=0
              for k,v in {'200th':30,'milestone':25,'walk-off':24,'go-ahead':22,'grand slam':21,'first big league':18,'home run':16,'homer':16,'game-tying':15,'no-hitter':15,'shutout':12,'strikes out':9,'diving catch':9,'rbi double':8}.items():
                  if k in t:s+=v
              for k,v in {'condensed game':-80,'game recap':-60,'recap':-50,'interview':-50,'talks':-35,'preview':-40}.items():
                  if k in t:s+=v
              d=secs(item.get('duration'))
              if d and 8<=d<=55:s+=8
              elif d and d>90:s-=20
              return s
          def esc(s):
              return str(s).replace('\\','\\\\').replace(':','\\:').replace("'","\\'").replace('%','\\%').replace('[','\\[').replace(']','\\]')
          def audio(path):
              p=subprocess.run(['ffprobe','-v','error','-select_streams','a:0','-show_entries','stream=codec_type','-of','csv=p=0',str(path)],capture_output=True,text=True)
              return bool(p.stdout.strip())
          def run(c):
              print('+',' '.join(shlex.quote(str(x)) for x in c)); subprocess.run(c,check=True)

          sched=get('https://statsapi.mlb.com/api/v1/schedule',sportId=1,date=DATE,hydrate='team,linescore')
          games=[g for d in sched.get('dates',[]) for g in d.get('games',[]) if (g.get('status',{}).get('abstractGameState') or '').lower()=='final']
          picks=[]
          for g in games:
              try: content=get(f"https://statsapi.mlb.com/api/v1/game/{g['gamePk']}/content")
              except Exception as e: print('content skip',g.get('gamePk'),e); continue
              seen=set(); cand=[]
              for it in walk(content):
                  p=pb(it)
                  if not p: continue
                  key=(it.get('title'),p.get('url'))
                  if key in seen: continue
                  seen.add(key); cand.append((score(it),secs(it.get('duration')),it,p))
              cand=[x for x in cand if x[0]>-10]
              if not cand: continue
              cand.sort(key=lambda x:x[0],reverse=True); sc,du,it,p=cand[0]
              away=g['teams']['away']['team']['name']; home=g['teams']['home']['team']['name']; a=g['teams']['away'].get('score',''); h=g['teams']['home'].get('score','')
              picks.append({'score':sc,'duration':du,'title':re.sub(r'\s+',' ',it.get('title','')).strip()[:70],'matchup':f'{away} @ {home}  {a}-{h}','url':p['url']})
              time.sleep(.08)
          picks=sorted(picks,key=lambda x:x['score'],reverse=True)[:MAX]
          if not picks: raise SystemExit('No official MLB MP4 playbacks found')
          print(json.dumps(picks,indent=2,ensure_ascii=False)); (W/'manifest.json').write_text(json.dumps(picks,indent=2,ensure_ascii=False))

          rendered=[]
          for i,c in enumerate(picks,1):
              raw=RAW/f'{i:02d}.mp4'; seg=SEG/f'{i:02d}.mp4'
              with S.get(c['url'],stream=True,timeout=90) as r:
                  r.raise_for_status()
                  with open(raw,'wb') as f:
                      for b in r.iter_content(524288):
                          if b:f.write(b)
              d=min(DUR,max(2.0,float(c['duration'] or DUR))); title=esc(c['title'].upper()); match=esc(c['matchup']); date=esc(DATE)
              vf=(f"[0:v]trim=duration={d},setpts=PTS-STARTPTS,scale=1080:608:force_original_aspect_ratio=decrease,pad=1080:608:(ow-iw)/2:(oh-ih)/2:black,setsar=1[fg];"
                  f"color=c=0x070B12:s=1080x1920:r=30:d={d}[bg];[bg][fg]overlay=0:656:shortest=1,drawbox=x=0:y=0:w=1080:h=12:color=0xE23B3B:t=fill,"
                  f"drawtext=fontfile={FONT}:text='SFANDOM':fontcolor=white:fontsize=42:x=64:y=86,drawtext=fontfile={FONT}:text='{title}':fontcolor=white:fontsize=43:x=64:y=350,"
                  f"drawtext=fontfile={FONT2}:text='{match}':fontcolor=0xC8CDD6:fontsize=29:x=64:y=530,drawtext=fontfile={FONT2}:text='OFFICIAL MLB HIGHLIGHT  •  {date}':fontcolor=0xAAB2C0:fontsize=25:x=64:y=1460,"
                  f"fade=t=in:st=0:d=0.12,fade=t=out:st={max(.1,d-.14)}:d=0.14[v]")
              if audio(raw):
                  filt=vf+f";[0:a]atrim=duration={d},asetpts=PTS-STARTPTS,aresample=48000[a]"
                  cmd=['ffmpeg','-y','-i',raw,'-filter_complex',filt,'-map','[v]','-map','[a]','-r','30','-c:v','libx264','-preset','medium','-crf','19','-c:a','aac','-b:a','160k','-ar','48000','-ac','2','-pix_fmt','yuv420p',seg]
              else:
                  cmd=['ffmpeg','-y','-i',raw,'-f','lavfi','-t',str(d),'-i','anullsrc=channel_layout=stereo:sample_rate=48000','-filter_complex',vf,'-map','[v]','-map','1:a:0','-r','30','-c:v','libx264','-preset','medium','-crf','19','-c:a','aac','-b:a','160k','-ar','48000','-ac','2','-pix_fmt','yuv420p',seg]
              run(cmd); rendered.append(seg)
          lst=W/'concat.txt'; lst.write_text(''.join(f"file '{p}'\n" for p in rendered)); joined=W/'joined.mp4'
          run(['ffmpeg','-y','-f','concat','-safe','0','-i',lst,'-c','copy',joined]); run(['ffmpeg','-y','-i',joined,'-t','45','-c','copy','-movflags','+faststart',OUT])
          print('OUTPUT',OUT)
          PY
          python /tmp/render.py
      - name: Upload MP4 preview
        uses: actions/upload-artifact@v4
        with:
          name: sfandom-mlb-highlights-2026-09-02
          path: dist/sfandom_mlb_highlights_2026-09-02.mp4
          if-no-files-found: error
