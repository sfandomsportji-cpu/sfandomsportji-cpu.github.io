name: Final Render Fix

on:
  push:
    branches:
      - fix/site-source-cleanup-20260827

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/site-source-cleanup-20260827
          fetch-depth: 0
      - name: Apply exact source fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('daily-analysis.css?v=20260827-clean4','daily-analysis.css?v=20260827-clean5')
          s=s.replace('live-dock.css?v=20260827-clean4','live-dock.css?v=20260827-clean5')
          s=s.replace('live-dock.js?v=20260827-clean4','live-dock.js?v=20260827-clean5')
          p.write_text(s)

          p=Path('live-dock.css')
          s=p.read_text()
          old='''  .sf-live-dock.is-collapsed{width:165px}\n  .sf-live-dock.is-collapsed .sf-live-dock-head{border-bottom:0}\n  .sf-live-dock-head{height:48px}'''
          new='''  .sf-live-dock.is-collapsed{width:56px}\n  .sf-live-dock.is-collapsed .sf-live-dock-head{border-bottom:0;justify-content:center;padding:0}\n  .sf-live-dock.is-collapsed .sf-live-dock-title{display:none}\n  .sf-live-dock.is-collapsed .sf-live-dock-actions a{display:none}\n  .sf-live-dock-head{height:48px}'''
          if old not in s:
              raise SystemExit('expected mobile dock block not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit exact fixes
        run: |
          git config user.name sfandom-cleanup-bot
          git config user.email actions@users.noreply.github.com
          git add index.html live-dock.css
          git diff --cached --quiet && exit 0
          git commit -m "Fix mobile LIVE overlap and refresh active cache keys [skip ci]"
          git push origin HEAD:fix/site-source-cleanup-20260827
