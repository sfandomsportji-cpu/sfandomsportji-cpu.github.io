name: Publish SFANDOM Brand Film

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-brand-film.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download finalized brand film
        env:
          VIDEO_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/d3b62452-5896-4c2a-b287-97caf084d8a3.mp4?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNDlmOGRjNjRhYmM5YTJhMSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4ODM5MDExNn0.p4k_jWF5fp6mgjXRoOycFt-Z85i74OY5wMBonwir2gE"
        run: |
          mkdir -p assets
          curl --fail --location --retry 3 "$VIDEO_URL" --output assets/sfandom-brand-film-20260901.mp4
          test $(stat -c%s assets/sfandom-brand-film-20260901.mp4) -gt 1000000

      - name: Commit video asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/sfandom-brand-film-20260901.mp4
          if git diff --cached --quiet; then
            echo "Video asset already present."
            exit 0
          fi
          git commit -m "Publish SFANDOM brand film video asset"
          git push
