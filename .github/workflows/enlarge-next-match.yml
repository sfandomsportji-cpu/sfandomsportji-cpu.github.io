name: Enlarge Next Match Starters

on:
  push:
    branches:
      - update/home-english-mascot-hq-20260828

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace starter portrait sizing at source
        run: |
          python - <<'PY'
          from pathlib import Path

          css = Path('daily-analysis.css')
          text = css.read_text(encoding='utf-8')
          replacements = {
            'height:clamp(480px,45vw,560px)': 'height:clamp(560px,50vw,650px)',
            '.daily-photo img{display:block;width:100%;height:100%;object-fit:contain;object-position:center bottom;transform:scale(1.08);transform-origin:center bottom;': '.daily-photo img{display:block;width:132%;max-width:none;height:112%;object-fit:cover;object-position:center 30%;transform:translateY(2%) scale(1.08);transform-origin:center center;',
            '  .daily-matchup-stage{height:318px;min-height:318px}': '  .daily-matchup-stage{height:360px;min-height:360px}',
            '  .daily-photo img{width:190%;max-width:none;height:100%;object-fit:cover;object-position:center 38%;transform:none;': '  .daily-photo img{width:215%;max-width:none;height:108%;object-fit:cover;object-position:center 31%;transform:translateY(1%);',
          }
          for old, new in replacements.items():
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'Expected exactly one match for {old!r}, found {count}')
            text = text.replace(old, new)
          css.write_text(text, encoding='utf-8')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          old = 'daily-analysis.css?v=20260827-clean5'
          new = 'daily-analysis.css?v=20260828-starters-large1'
          if html.count(old) != 1:
            raise SystemExit(f'Expected one daily-analysis cache ref, found {html.count(old)}')
          index.write_text(html.replace(old, new), encoding='utf-8')

          Path('.github/workflows/enlarge-next-match.yml').unlink()
          PY

          ! grep -q 'height:clamp(480px,45vw,560px)' daily-analysis.css
          grep -q 'height:clamp(560px,50vw,650px)' daily-analysis.css
          grep -q 'daily-analysis.css?v=20260828-starters-large1' index.html

          git config user.name 'sfandomsportji-cpu'
          git config user.email 'sfandomsportji@gmail.com'
          git add -A
          git commit -m 'Enlarge NEXT MATCH starter portraits'
          git push origin HEAD
