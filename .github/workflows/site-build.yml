name: Site build (블로그 새 글 · 팀 로고 반영)

# 구글·네이버 블로그 새 글을 받아 홈·사이트맵에 반영합니다. API 비용 없음.
on:
  schedule:
    - cron: "17,47 * * * *"   # 30분마다 (GitHub 예약 실행이 자주 밀려서 간격을 좁힘. 구글 글은 방문 시 실시간, 네이버 글은 빌드 때 반영)
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/site-build.yml"
      - "!src/content/games-snapshot.json" # bot-updated snapshot must not recursively retrigger
  workflow_dispatch:

permissions:
  contents: write

concurrency: site-build

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install social preview image dependency
        run: python3 -m pip install Pillow==11.3.0
      - name: Korean font for article share cards
        run: |
          fc-list | grep -qi "Noto Sans CJK KR" || (sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk)
      - name: Team logos (없는 것만 받아 저장소에 보관)
        run: python3 src/tools/fetch_logos.py
      - name: Build share preview card (1200x630)
        run: python3 src/tools/build_social_card.py
      - name: Expire reference photos (3 days)
        run: python3 src/tools/expire_photos.py
      - name: Build per-article share cards (1200x630)
        run: python3 src/tools/build_article_cards.py
      - name: Sync league scores and schedules (ESPN, verified states only)
        run: python3 src/tools/sync_games.py
      - name: Sync NPB scores (npb.jp, robots.txt 허용 · 실패 시 이전 값 유지)
        run: python3 src/tools/sync_npb.py
      - name: Sync postseason / NBA / hero from verified scores
        run: python3 src/tools/sync_postseason.py
      - name: Build
        run: python3 src/build.py
      # Automatic article drafting/Telegram alerts are disabled. Editorial publication requires approval.
      # check.py reads the Git index: include generated files and expired deletions.
      # Staging is local only; failed validation prevents every commit/push.
      - name: Stage generated files for validation
        run: git add -A
      - name: Site check (check.py) - 필수 검증 실패 시 빌드 중단
        run: python3 src/tools/check.py
      - name: Commit if changed (concurrent source updates safe)
        run: |
          git config user.name "sfandom-bot"
          git config user.email "sfandom-bot@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then
            echo "No generated changes."
            exit 0
          fi
          git add -A
          git commit -m "build: 블로그 새 글 반영 $(TZ=Asia/Seoul date +%Y-%m-%d\ %H:%M)"
          for attempt in 1 2 3; do
            if git push; then
              echo "Generated pages pushed on attempt $attempt."
              exit 0
            fi
            echo "Main advanced during build: refreshing generated files (attempt $attempt)."
            git fetch origin main
            git reset --hard origin/main
            # 다른 배포와 겹쳐 리셋했을 때도 점수 스냅샷을 반드시 다시 수집한다.
            # HTML만 재생성하면 새로 확인한 NPB 날짜가 사라질 수 있다.
            python3 src/tools/sync_games.py
            python3 src/tools/sync_npb.py
            python3 src/tools/sync_postseason.py
            python3 src/build.py
            git add -A
            python3 src/tools/check.py
            if [ -z "$(git status --porcelain)" ]; then
              echo "Latest main already has the generated result."
              exit 0
            fi
            git add -A
            git commit -m "build: 최신 main 기준 재생성 $(TZ=Asia/Seoul date +%Y-%m-%d\ %H:%M)"
          done
          echo "Generated commit could not be pushed after three retries." >&2
          exit 1
