name: One-time recovery cache bust

on:
  push:
    paths:
      - '.github/workflows/recovery-cachebust.yml'

permissions:
  contents: write

jobs:
  refresh-recovery-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh stable recovery asset keys
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = [Path('index.html'), Path('about.html'), Path('analysis.html'), Path('content.html')]
          for p in files:
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              s = re.sub(r'music-player\.css\?v=[^"\']+', 'music-player.css?v=20260827-recovery1', s)
              s = re.sub(r'music-player\.js\?v=[^"\']+', 'music-player.js?v=20260827-recovery1', s)
              p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/recovery-cachebust.yml
          git config user.name "sfandom-recovery"
          git config user.email "actions@users.noreply.github.com"
          git add index.html about.html analysis.html content.html .github/workflows/recovery-cachebust.yml
          git commit -m "Refresh stable recovery assets"
          git push
