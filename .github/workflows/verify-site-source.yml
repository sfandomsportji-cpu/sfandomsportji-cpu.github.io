name: Verify generated site and game center

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python3 -m py_compile src/build.py src/tools/sync_games.py src/tools/editorial_paths.py
      - name: Verify provider access and refresh snapshot in CI
        run: |
          python3 src/tools/sync_games.py
          python3 - <<'PY'
          import datetime as dt
          import json
          from pathlib import Path
          path = Path("src/content/games-snapshot.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          now = dt.datetime.now(dt.timezone.utc)
          for league in ("MLB", "NBA", "NFL", "NHL"):
              checked = data["leagues"].get(league, {}).get("checked_at")
              if not checked:
                  raise SystemExit(f"Missing fresh provider data for {league}")
              age = now - dt.datetime.fromisoformat(checked)
              print(league, "age_seconds", round(age.total_seconds()))
              if not dt.timedelta(seconds=-300) <= age < dt.timedelta(minutes=8):
                  raise SystemExit(f"Scoreboard provider did not refresh {league}")
          PY
      - name: Generate site from repository source
        run: python3 src/build.py
      - name: Verify published templates and KST game center
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path(".")
          home = (root / "index.html").read_text(encoding="utf-8")
          about = (root / "about/index.html").read_text(encoding="utf-8")
          magazine = (root / "magazine/index.html").read_text(encoding="utf-8")
          games = (root / "games/index.html").read_text(encoding="utf-8")
          assert 'id="sfIdentityTitle"' in home, "item 01 brand story lost"
          assert 'id="kairoDeskTitle"' in magazine, "item 02 editorial desk lost"
          assert "스포츠에서 얻은 가치를 다시 사람에게" in about, "about mission lost"
          assert 'id="scorePreviewTitle"' in home, "homepage multi-league preview missing"
          assert 'sf-scores__league' in games, "game center missing"
          assert games.count('class="sf-scores__league"') == 4, "four leagues missing"
          assert "확인 시각" in games, "freshness disclosure missing"
          analysis = (root / "analysis/index.html").read_text(encoding="utf-8")
          review = (root / "analysis/review/index.html").read_text(encoding="utf-8")
          index = (root / "analysis/reading-paths/index.html").read_text(encoding="utf-8")
          archived = (root / "analysis/mlb/2026-10-11-nlcs-dodgers-brewers-game1/index.html").read_text(encoding="utf-8")
          assert 'id="cycleGuideTitle"' in analysis, "approved pregame guide lost"
          assert 'id="cycleReviewTitle"' in review, "approved postgame guide lost"
          assert 'cycle-article-note' in archived, "archived analysis notice lost"
          assert 'ALDS 5차전' in review and '프리시즌 7경기' in review, "preview-review pairs missing"
          assert index.count('class="editorial-links__group"') == 5, "independent editorial groups missing"
          assert "INDEPENDENT STORIES" in index, "separate articles hidden"
          assert 'editorial-links__related' in archived, "original related article links missing"
          print("PASS: approved 01-04 components persist; paired reviews and unique article links generated.")
          print("PASS: original 01/02 preserved; four-league game center generated.")
          PY
