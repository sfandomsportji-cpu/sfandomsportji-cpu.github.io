name: Import SFANDOM R&B Music V3

on:
  push:
    paths:
      - '.github/workflows/import-sfandom-music-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-music:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium --with-deps >/dev/null 2>&1
      - name: Resolve Pixabay MP3 URLs in a real browser
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const {chromium}=require('playwright');

          const tracks=[
            {file:'sfandom-rnb-01-smooth-rnb-beat.mp3',title:'Smooth Rnb Beat',artist:'Tunetank',page:'https://pixabay.com/music/beats-smooth-rnb-beat-409348/'},
            {file:'sfandom-rnb-02-modern-rnb.mp3',title:'Modern R&B',artist:'-SunSet-',page:'https://pixabay.com/music/beats-modern-rampb-550856/'},
            {file:'sfandom-rnb-03-private-thoughts.mp3',title:'Private Thoughts - Chill Late Night Trapsoul Instrumental',artist:'JayStacksBeats',page:'https://pixabay.com/music/funk-private-thoughts-chill-late-night-trapsoul-instrumental-462717/'},
            {file:'sfandom-rnb-04-low-glow.mp3',title:'Low Glow - Warm R&B Chill for Relaxed Focus',artist:'OpenUseMusic',page:'https://pixabay.com/music/rnb-low-glow-warm-rampb-chill-for-relaxed-focus-460279/'}
          ];

          (async()=>{
            const out='assets/music';fs.mkdirSync(out,{recursive:true});
            const browser=await chromium.launch({headless:true,args:['--disable-blink-features=AutomationControlled']});
            const context=await browser.newContext({
              userAgent:'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36',
              locale:'en-US',
              viewport:{width:1440,height:1000}
            });
            const manifest=[];const diagnostics=[];
            for(const t of tracks){
              const d={title:t.title,page:t.page};
              const page=await context.newPage();
              let networkMp3='';
              page.on('response',r=>{const u=r.url();if(!networkMp3&&u.includes('cdn.pixabay.com')&&u.includes('.mp3'))networkMp3=u;});
              try{
                const resp=await page.goto(t.page,{waitUntil:'domcontentloaded',timeout:90000});
                d.http_status=resp?resp.status():null;
                await page.waitForTimeout(4000);
                d.title_seen=await page.title();
                d.body_preview=(await page.locator('body').innerText().catch(()=>'' )).slice(0,300);
                let mp3=await page.evaluate(()=>{
                  const valid=u=>typeof u==='string'&&u.startsWith('https://cdn.pixabay.com/')&&u.includes('.mp3');
                  const walk=o=>{
                    if(!o)return null;
                    if(Array.isArray(o)){for(const v of o){const h=walk(v);if(h)return h}return null}
                    if(typeof o==='object'){
                      if(valid(o.contentUrl))return o.contentUrl;
                      for(const v of Object.values(o)){const h=walk(v);if(h)return h}
                    }
                    return null;
                  };
                  for(const s of document.querySelectorAll('script[type="application/ld+json"]')){
                    try{const h=walk(JSON.parse(s.textContent||'{}'));if(h)return h}catch{}
                  }
                  const html=document.documentElement.innerHTML;
                  const m=html.match(/https:\/\/cdn\.pixabay\.com\/[^"'<> ]+?\.mp3[^"'<> ]*/);
                  return m?m[0].replaceAll('\\/','/'):null;
                });
                if(!mp3){
                  const playCandidates=page.locator('button');
                  const n=await playCandidates.count();
                  for(let i=0;i<Math.min(n,30)&&!networkMp3;i++){
                    const b=playCandidates.nth(i);
                    const label=((await b.getAttribute('aria-label').catch(()=>''))||'')+' '+((await b.innerText().catch(()=>''))||'');
                    if(/play/i.test(label)){await b.click({timeout:2000}).catch(()=>{});await page.waitForTimeout(1500);}
                  }
                  mp3=networkMp3||null;
                }
                if(!mp3)throw new Error('No Pixabay MP3 URL found in rendered page');
                d.mp3_url_found=true;
                const res=await context.request.get(mp3,{timeout:120000});
                if(!res.ok())throw new Error('MP3 download HTTP '+res.status());
                const buf=await res.body();
                if(buf.length<100000)throw new Error('Downloaded MP3 too small: '+buf.length);
                fs.writeFileSync(path.join(out,t.file),buf);
                d.download_bytes=buf.length;
                manifest.push({file:`assets/music/${t.file}`,title:t.title,artist:t.artist,source_page:t.page,license:'Pixabay Content License',license_url:'https://pixabay.com/service/license-summary/'});
              }catch(e){d.error=String(e&&e.stack||e).slice(0,2500)}
              diagnostics.push(d);
              await page.close();
            }
            await browser.close();
            fs.writeFileSync(path.join(out,'sources.json'),JSON.stringify(manifest,null,2)+'\n');
            fs.writeFileSync(path.join(out,'import-diagnostics-v3.json'),JSON.stringify(diagnostics,null,2)+'\n');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Commit imported music
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/music
          if git diff --cached --quiet; then
            echo 'No music changes.'
          else
            git commit -m 'Import approved SFANDOM R&B music with browser resolver'
            git pull --rebase origin main
            git push origin main
          fi
