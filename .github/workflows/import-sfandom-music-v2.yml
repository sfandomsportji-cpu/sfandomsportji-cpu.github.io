name: Import SFANDOM R&B Music V2

on:
  push:
    paths:
      - '.github/workflows/import-sfandom-music-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-music:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve and download approved tracks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.parse import urlparse, quote
          import html as htmlmod
          import json, re, time, traceback

          tracks=[
            {'file':'sfandom-rnb-01-smooth-rnb-beat.mp3','title':'Smooth Rnb Beat','artist':'Tunetank','page':'https://pixabay.com/music/beats-smooth-rnb-beat-409348/'},
            {'file':'sfandom-rnb-02-modern-rnb.mp3','title':'Modern R&B','artist':'-SunSet-','page':'https://pixabay.com/music/beats-modern-rampb-550856/'},
            {'file':'sfandom-rnb-03-private-thoughts.mp3','title':'Private Thoughts - Chill Late Night Trapsoul Instrumental','artist':'JayStacksBeats','page':'https://pixabay.com/music/funk-private-thoughts-chill-late-night-trapsoul-instrumental-462717/'},
            {'file':'sfandom-rnb-04-low-glow.mp3','title':'Low Glow - Warm R&B Chill for Relaxed Focus','artist':'OpenUseMusic','page':'https://pixabay.com/music/rnb-low-glow-warm-rampb-chill-for-relaxed-focus-460279/'}
          ]
          outdir=Path('assets/music'); outdir.mkdir(parents=True,exist_ok=True)
          headers={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept-Language':'en-US,en;q=0.9'}

          def get(url,timeout=90):
            req=Request(url,headers=headers)
            with urlopen(req,timeout=timeout) as r:
              return r.read(),getattr(r,'status',None),r.geturl()

          def fetch_page(url):
            proxy='https://api.allorigins.win/raw?url='+quote(url,safe='')
            raw,status,final=get(proxy,90)
            return raw.decode('utf-8','replace'),status,final

          def valid(u):
            if not isinstance(u,str) or '.mp3' not in u:return False
            p=urlparse(u)
            return p.scheme=='https' and p.netloc=='cdn.pixabay.com'

          def walk(o):
            if isinstance(o,dict):
              if valid(o.get('contentUrl')):return o['contentUrl']
              for v in o.values():
                h=walk(v)
                if h:return h
            elif isinstance(o,list):
              for v in o:
                h=walk(v)
                if h:return h
            return None

          def extract(doc):
            scripts=re.findall(r'<script[^>]*type=["\']application/ld\+json["\'][^>]*>(.*?)</script>',doc,flags=re.I|re.S)
            for raw in scripts:
              try:data=json.loads(htmlmod.unescape(raw).strip())
              except Exception:continue
              h=walk(data)
              if h:return h,len(scripts)
            for pat in [r'https:\/\/cdn\.pixabay\.com\/[^"\']+?\.mp3[^"\']*',r'https://cdn\.pixabay\.com/[^"\']+?\.mp3[^"\']*']:
              m=re.search(pat,doc)
              if m:return htmlmod.unescape(m.group(0).replace('\\/','/')),len(scripts)
            raise RuntimeError(f'No Pixabay MP3 URL found; jsonld={len(scripts)}')

          manifest=[]; diagnostics=[]
          for t in tracks:
            d={'title':t['title'],'page':t['page']}
            try:
              doc,status,final=fetch_page(t['page'])
              d.update({'proxy_status':status,'proxy_final':final,'html_bytes':len(doc.encode('utf-8')),'has_jsonld':'application/ld+json' in doc,'has_contentUrl':'contentUrl' in doc,'has_cdn':'cdn.pixabay.com' in doc})
              mp3,n=extract(doc); d.update({'jsonld_count':n,'mp3_url_found':True})
              raw,_,_=get(mp3,180)
              dest=outdir/t['file']; dest.write_bytes(raw)
              d['download_bytes']=dest.stat().st_size
              if dest.stat().st_size<100000:raise RuntimeError('Downloaded file too small')
              manifest.append({'file':str(dest),'title':t['title'],'artist':t['artist'],'source_page':t['page'],'license':'Pixabay Content License','license_url':'https://pixabay.com/service/license-summary/'})
              time.sleep(1)
            except Exception as e:
              d['error']=repr(e);d['traceback']=traceback.format_exc()[-2500:]
            diagnostics.append(d)

          (outdir/'sources.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (outdir/'import-diagnostics-v2.json').write_text(json.dumps(diagnostics,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Commit imported music
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/music
          if git diff --cached --quiet; then
            echo 'No music changes.'
          else
            git commit -m 'Import approved SFANDOM R&B music'
            git pull --rebase origin main
            git push origin main
          fi
