name: Capture 2026-10-11 full-page site screenshot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-morning-20261011.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up headless browser capture
        run: npm install --no-save playwright-core@1.56.1
      - name: Screenshot public homepage full height
        run: |
          mkdir -p assets/captures
          node <<'NODE'
          const { chromium } = require('playwright-core');
          (async () => {
            const browser = await chromium.launch({headless:true,channel:'chrome',args:['--no-sandbox','--disable-dev-shm-usage']});
            try {
              const page = await browser.newPage({viewport:{width:1440,height:900},deviceScaleFactor:1});
              const response = await page.goto('https://sfandom.com/?capture=20261011-5storyfix',{waitUntil:'domcontentloaded',timeout:45000});
              console.log('Public page HTTP:',response?.status());
              if (!response || response.status() !== 200) throw new Error('Public website did not return HTTP 200.');
              await page.locator('#heroTitle').waitFor({timeout:20000});
              const headline=await page.locator('#heroTitle').innerText();
              console.log('Public hero:',headline);
              if(!headline.includes('103승과 100승')) throw new Error('Live site still shows previous edition, screenshot cancelled.');
              const sectionTitle=await page.locator('#taTitle').innerText();
              const featured=page.locator('#today-analysis .morning-feature-grid .morning-card');
              const count=await featured.count();
              console.log('Today section:', sectionTitle, 'feature cards:', count);
              if(!sectionTitle.includes('2026.10.11') || count!==5) throw new Error('Five current-edition cards not visible on the public homepage');
              for(const slug of ['nlcs-dodgers-brewers-game1','eagles-jaguars-london','mls-weekend-watch','mavericks-rockets-macao-rematch','fanboard-sunday-questions']){
                if(await featured.locator('a[href*="'+slug+'"]').count()!==1) throw new Error('Missing article card: '+slug);
              }
              await page.evaluate(async () => {
                document.querySelectorAll('img[loading="lazy"]').forEach(img=>img.loading='eager');
                try {await document.fonts.ready;}catch(e){}
              });
              await page.waitForTimeout(4000);
              await page.screenshot({path:'assets/captures/sfandom-2026-10-11-fullpage.png',fullPage:true,animations:'disabled',timeout:60000});
              console.log('Screenshot file created.');
            } finally {await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE
      - name: Commit verified full-page capture
        run: |
          git config user.name "sfandom-bot"
          git config user.email "sfandom-bot@users.noreply.github.com"
          git add assets/captures/sfandom-2026-10-11-fullpage.png
          git commit -m "docs: capture live SFANDOM 2026-10-11 full-page screenshot"
          git push
