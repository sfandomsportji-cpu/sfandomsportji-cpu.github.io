name: Install SFANDOM Music Player

on:
  push:
    paths:
      - '.github/workflows/install-sfandom-music-player.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-player:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add shared music player to site pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          pages=['index.html','analysis.html','content.html','about.html']
          css='  <link rel="stylesheet" href="music-player.css?v=20260824-0606" />\n'
          js='  <script src="music-player.js?v=20260824-0606"></script>\n'

          for name in pages:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              if 'music-player.css' not in s:
                  if '</head>' not in s:
                      raise SystemExit(f'</head> not found in {name}')
                  s=s.replace('</head>',css+'</head>',1)
              if 'music-player.js' not in s:
                  if '</body>' not in s:
                      raise SystemExit(f'</body> not found in {name}')
                  s=s.replace('</body>',js+'</body>',1)
              p.write_text(s,encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html analysis.html content.html about.html
          if git diff --cached --quiet; then
            echo 'Music player is already installed.'
          else
            git commit -m 'Install SFANDOM background music player site-wide'
            git push
          fi
