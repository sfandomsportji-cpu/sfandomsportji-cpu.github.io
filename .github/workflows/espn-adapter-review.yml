name: ESPN three-sport adapter (offline review only)

on:
  pull_request:
    paths:
      - src/tools/espn_adapter.py
      - tests/test_espn_adapter.py
      - tests/fixtures/espn_*.json
      - docs/ESPN-ADAPTER-REVIEW.md
      - .github/workflows/espn-adapter-review.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Review-only ESPN basketball soccer baseball fixtures
        run: python -m unittest discover -s tests -p 'test_espn_adapter.py' -v
