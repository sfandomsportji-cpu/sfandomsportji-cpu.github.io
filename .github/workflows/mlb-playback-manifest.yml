name: MLB Playback Manifest

on:
  pull_request:
    paths:
      - 'tools/mlb_playback_manifest.py'
      - '.github/workflows/mlb-playback-manifest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install requests
      - name: Extract official playback URLs
        run: python tools/mlb_playback_manifest.py
      - uses: actions/upload-artifact@v4
        with:
          name: mlb-playback-manifest-2026-09-04
          path: playback_manifest.json
          retention-days: 1
