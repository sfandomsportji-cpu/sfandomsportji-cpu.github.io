name: Daily Morning Edition (승인 요청)

on:
  # 매일 자동 실행은 꺼둠 (ANTHROPIC_API_KEY 미등록). 키 등록 후 아래 두 줄 주석 해제
  # schedule:
  #   - cron: "0 23 * * *"   # 매일 08:00 KST (UTC 23:00)
  workflow_dispatch:        # Actions 탭에서 수동 실행 가능

permissions:
  contents: write
  pull-requests: write

concurrency: daily-edition

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install anthropic

      - name: 날짜
        id: d
        run: echo "date=$(TZ=Asia/Seoul date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # 홈 4개 슬롯 초안 작성 + 이전 에디션 archive/morning/ 보존
      - name: 오늘 에디션 초안 작성
        id: gen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_edition.py

      # 승인 요청 = Pull Request (GitHub 이메일/앱 알림 자동 발송)
      - name: 승인 요청 보내기
        id: cpr
        if: steps.gen.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: content/${{ steps.d.outputs.date }}-morning
          add-paths: |
            index.html
            archive/morning/*.html
          commit-message: "content: ${{ steps.d.outputs.date }} morning edition draft"
          title: "📰 [승인 요청] ${{ steps.d.outputs.date }} 모닝 에디션"
          body-path: ${{ runner.temp }}/pr_body.md
          labels: edition, needs-approval
          assignees: sfandomsportji-cpu
          delete-branch: true

      # 텔레그램 알림 (시크릿 등록 시에만 동작, 미등록이면 건너뜀)
      - name: 텔레그램 승인 알림
        if: steps.cpr.outputs.pull-request-url != ''
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
          DATE: ${{ steps.d.outputs.date }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then echo "텔레그램 미설정 - 건너뜀"; exit 0; fi
          curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=📰 SFANDOM ${DATE} 모닝 에디션 초안이 준비됐어요.
          확인 후 Merge = 게시 / Close = 폐기
          ${PR_URL}"

      - name: 실패 알림
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then exit 0; fi
          curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=⚠️ SFANDOM 에디션 생성 실패. 사이트는 기존 에디션 유지 중.
          ${RUN_URL}"
