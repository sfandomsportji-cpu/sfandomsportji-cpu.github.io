name: Render Homepage Check

on:
  push:
    branches:
      - update/home-english-mascot-hq-20260828

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render desktop and mobile homepage
        run: |
          python -m http.server 8000 >/tmp/sfandom-http.log 2>&1 &
          SERVER_PID=$!
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/index.html >/dev/null; then break; fi
            sleep 1
          done
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,2400 --screenshot=/tmp/sfandom-home-pc.png http://127.0.0.1:8000/index.html
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,1800 --screenshot=/tmp/sfandom-home-mobile.png http://127.0.0.1:8000/index.html
          kill $SERVER_PID || true
      - uses: actions/upload-artifact@v4
        with:
          name: sfandom-home-render-check
          path: |
            /tmp/sfandom-home-pc.png
            /tmp/sfandom-home-mobile.png
          retention-days: 1
      - name: Remove temporary render workflow
        run: |
          rm .github/workflows/render-home-check.yml
          git config user.name 'sfandomsportji-cpu'
          git config user.email 'sfandomsportji@gmail.com'
          git add -A
          git commit -m 'Remove temporary homepage render workflow'
          git push origin HEAD
