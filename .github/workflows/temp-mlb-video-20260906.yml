name: TEMP MLB 2026-09-06 7 Game Render

on:
  push:
    branches:
      - temp/mlb-video-20260906
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout temp branch
        uses: actions/checkout@v4

      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install requests pillow

      - name: Render MLB reel with original game audio
        run: python tools/temp_mlb_20260906_build.py

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: sfandom-mlb-20260906-7games
          path: mlb_20260906_output/
          if-no-files-found: error
          retention-days: 3
