name: MLB Official Highlight Preview

on:
  pull_request:
    paths:
      - 'tools/mlb_official_highlight_builder.py'
      - 'tools/mlb_official_highlight_builder_fast.py'
      - '.github/workflows/mlb-highlight-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pillow

      - name: Build official MLB highlight preview
        run: |
          python tools/mlb_official_highlight_builder_fast.py --date 2026-09-04 --out output

      - name: List output
        if: always()
        run: |
          find output -maxdepth 2 -type f -printf '%p %k KB\n' | sort || true

      - name: Upload preview package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-official-highlights-2026-09-04
          path: |
            output/SFANDOM_MLB_2026-09-04_OFFICIAL_HIGHLIGHTS_9x16.mp4
            output/SFANDOM_MLB_2026-09-04_thumbnail.jpg
            output/SFANDOM_MLB_2026-09-04_caption.txt
            output/manifest.json
          if-no-files-found: error
          retention-days: 3
