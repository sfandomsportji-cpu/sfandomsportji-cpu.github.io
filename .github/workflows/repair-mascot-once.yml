name: Repair Mascot Once

on:
  push:
    branches:
      - fix/mascot-binary-repair-20260828
    paths:
      - '.github/workflows/repair-mascot-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/mascot-binary-repair-20260828
          fetch-depth: 0

      - name: Rebuild and verify mascot binary
        shell: bash
        run: |
          set -euo pipefail
          cat .repair/mascot.part01 .repair/mascot.part02 .repair/mascot.part03 .repair/mascot.part04 .repair/mascot.part05 .repair/mascot.part06 .repair/mascot.part07 > /tmp/mascot.b64
          base64 --decode /tmp/mascot.b64 > assets/sfandom-ji-kairo-analysis-20260828.webp
          echo '1382156cb97c7c184ed1b68c8e4aca1d71c0d6738faf26ac16eef772517903b7  assets/sfandom-ji-kairo-analysis-20260828.webp' | sha256sum --check --strict
          test "$(stat -c%s assets/sfandom-ji-kairo-analysis-20260828.webp)" -eq 92240
          file assets/sfandom-ji-kairo-analysis-20260828.webp | grep -qi 'Web/P image\|WebP'

      - name: Remove all repair residue and commit only final asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sfandomsportji-cpu'
          git config user.email 'sfandomsportji@gmail.com'
          rm -rf .repair
          rm -f .github/workflows/repair-mascot-once.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -A assets/sfandom-ji-kairo-analysis-20260828.webp .repair .github || true
          git add -A
          git commit -m 'Repair mascot binary and purge staging residue'
          git push origin HEAD:fix/mascot-binary-repair-20260828
