name: Repair Mascot Once

on:
  push:
    branches:
      - fix/mascot-binary-repair-20260828
    paths:
      - '.github/workflows/repair-mascot-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/mascot-binary-repair-20260828
          fetch-depth: 0

      - name: Repair corrupted base64 chunks from verified hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          ALPHABET = b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'

          def digest(data):
              return hashlib.sha256(data).hexdigest()

          def fix_substitution(path, target):
              p = Path(path)
              data = p.read_bytes()
              if digest(data) == target:
                  print(path, 'already OK')
                  return
              if len(data) != 20000:
                  raise SystemExit(f'{path}: unexpected length {len(data)}')
              prefix = hashlib.sha256()
              for i, original in enumerate(data):
                  suffix = data[i+1:]
                  for c in ALPHABET:
                      if c == original:
                          continue
                      h = prefix.copy()
                      h.update(bytes((c,)))
                      h.update(suffix)
                      if h.hexdigest() == target:
                          fixed = data[:i] + bytes((c,)) + suffix
                          p.write_bytes(fixed)
                          print(f'{path}: repaired substitution at {i}: {chr(original)} -> {chr(c)}')
                          return
                  prefix.update(bytes((original,)))
              raise SystemExit(f'{path}: no single-character substitution matched target')

          def fix_insertion(path, target):
              p = Path(path)
              data = p.read_bytes()
              if digest(data) == target:
                  print(path, 'already OK')
                  return
              if len(data) != 19999:
                  raise SystemExit(f'{path}: unexpected length {len(data)}')
              prefix = hashlib.sha256()
              for i in range(len(data) + 1):
                  suffix = data[i:]
                  for c in ALPHABET:
                      h = prefix.copy()
                      h.update(bytes((c,)))
                      h.update(suffix)
                      if h.hexdigest() == target:
                          fixed = data[:i] + bytes((c,)) + suffix
                          p.write_bytes(fixed)
                          print(f'{path}: restored missing character at {i}: {chr(c)}')
                          return
                  if i < len(data):
                      prefix.update(data[i:i+1])
              raise SystemExit(f'{path}: no single-character insertion matched target')

          fix_substitution('.repair/mascot.part03', '081b1f3a8f3a36ae3e6f56272734b73da4550e19943d646fed9c7fe0f8890474')
          fix_insertion('.repair/mascot.part05', 'e5b5e5805a3aaea237b90f55aee9de93f36722a79dfbdb2e5d3ad9f0cd775f46')
          fix_insertion('.repair/mascot.part06', 'bf87f3be05cf182e390df6a50e161d01f1e8129d651792042062bc24c9bc5de3')
          PY

      - name: Verify every staged chunk
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < .repair/mascot.part01)" -eq 20000
          test "$(wc -c < .repair/mascot.part02)" -eq 20000
          test "$(wc -c < .repair/mascot.part03)" -eq 20000
          test "$(wc -c < .repair/mascot.part04)" -eq 20000
          test "$(wc -c < .repair/mascot.part05)" -eq 20000
          test "$(wc -c < .repair/mascot.part06)" -eq 20000
          test "$(wc -c < .repair/mascot.part07)" -eq 2988
          echo 'fa86c361497f0b8ed355d16d99d801e276c535e1672695109341d9750fc1c119  .repair/mascot.part01' | sha256sum -c -
          echo '520b97c8ba14ff5f8c8267619c16426c693271382ca1c9a0d29103f542945f34  .repair/mascot.part02' | sha256sum -c -
          echo '081b1f3a8f3a36ae3e6f56272734b73da4550e19943d646fed9c7fe0f8890474  .repair/mascot.part03' | sha256sum -c -
          echo 'ed98916d8ce4f4e0a3be4321fe01191a10dc53dae09b6d588253a74686e1ccc9  .repair/mascot.part04' | sha256sum -c -
          echo 'e5b5e5805a3aaea237b90f55aee9de93f36722a79dfbdb2e5d3ad9f0cd775f46  .repair/mascot.part05' | sha256sum -c -
          echo 'bf87f3be05cf182e390df6a50e161d01f1e8129d651792042062bc24c9bc5de3  .repair/mascot.part06' | sha256sum -c -
          echo 'c6eacea033301ed1f1e525b6423b3dad14912cab176179ed97cce824bd05a5d2  .repair/mascot.part07' | sha256sum -c -

      - name: Rebuild and verify final mascot binary
        shell: bash
        run: |
          set -euo pipefail
          cat .repair/mascot.part01 .repair/mascot.part02 .repair/mascot.part03 .repair/mascot.part04 .repair/mascot.part05 .repair/mascot.part06 .repair/mascot.part07 > /tmp/mascot.b64
          test "$(wc -c < /tmp/mascot.b64)" -eq 122988
          base64 --decode /tmp/mascot.b64 > assets/sfandom-ji-kairo-analysis-20260828.webp
          echo '1382156cb97c7c184ed1b68c8e4aca1d71c0d6738faf26ac16eef772517903b7  assets/sfandom-ji-kairo-analysis-20260828.webp' | sha256sum --check --strict
          test "$(stat -c%s assets/sfandom-ji-kairo-analysis-20260828.webp)" -eq 92240
          file assets/sfandom-ji-kairo-analysis-20260828.webp | grep -qi 'Web/P image\|WebP'

      - name: Purge repair residue and commit final asset only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sfandomsportji-cpu'
          git config user.email 'sfandomsportji@gmail.com'
          rm -rf .repair
          rm -f .github/workflows/repair-mascot-once.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -A
          git commit -m 'Repair mascot binary and purge staging residue'
          git push origin HEAD:fix/mascot-binary-repair-20260828
