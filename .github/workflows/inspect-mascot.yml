name: Inspect Mascot Sources

on:
  push:
    branches:
      - update/home-english-mascot-hq-20260828

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect all historical mascot blobs
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          import subprocess, io
          from PIL import Image
          rows=[]
          out=subprocess.check_output(['git','rev-list','--objects','--all'], text=True, errors='ignore').splitlines()
          seen=set()
          for line in out:
            parts=line.split(' ',1)
            if len(parts)!=2: continue
            sha,path=parts
            low=path.lower()
            if not path.startswith('assets/'): continue
            if not any(k in low for k in ['kairo','ji-','bear','mascot','duo','vivid']): continue
            if not low.endswith(('.webp','.png','.jpg','.jpeg','.avif')): continue
            key=(sha,path)
            if key in seen: continue
            seen.add(key)
            try:
              data=subprocess.check_output(['git','cat-file','blob',sha])
              im=Image.open(io.BytesIO(data))
              rows.append((im.width*im.height,im.width,im.height,len(data),sha,path,im.mode))
            except Exception:
              pass
          for _,w,h,size,sha,path,mode in sorted(rows, reverse=True):
            print(f'{w}x{h} | {size} bytes | {sha} | {path} | {mode}')
          PY
