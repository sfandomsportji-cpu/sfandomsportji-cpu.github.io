name: Apply Home English Headings and Mascot HQ

on:
  push:
    branches:
      - update/home-english-mascot-hq-20260828

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source replacements
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageEnhance, ImageFilter

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          replacements = {
            'Cole과 Wesneski,<br><span>선발에서 시작되는 승부.</span>': 'Cole and Wesneski,<br><span>The Matchup Starts on the Mound.</span>',
            '어제의 스포츠를<br><span>오늘의 데이터로.</span>': "Yesterday’s Sports,<br><span>Today’s Data.</span>",
            '픽은 짧고 선명하게,<br><span>기록은 계속 쌓이게.</span>': 'Clear Picks.<br><span>Records That Keep Growing.</span>',
            '과정을 검증하고,<br><em>가치를 찾습니다.</em>': 'Verify the Process.<br><em>Find the Value.</em>',
            '데이터를 비교해,<br>결론을 만듭니다.': 'Compare the Data.<br>Build the Conclusion.',
            '핵심은 빠르게,<br>분석은 깊이 있게.': 'Fast on the Essentials.<br>Deep on the Analysis.',
            'Ji와 KAIRO가<br>함께 만듭니다.': 'Built Together by<br>Ji &amp; KAIRO.',
            '스포츠는 변수가 많습니다.<br><span>데이터는 판단의 기준을 만듭니다.</span>': 'Sports Are Full of Variables.<br><span>Data Creates the Standard for Decisions.</span>',
            'home.css?v=20260827-clean3': 'home.css?v=20260828-english-hq1',
          }
          for old, new in replacements.items():
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'Expected exactly one match for {old!r}, found {count}')
            text = text.replace(old, new)
          index.write_text(text, encoding='utf-8')

          src = Path('assets/ji-kairo-duo-vivid-420.avif')
          if not src.exists():
            raise SystemExit('Current mascot source missing')
          im = Image.open(src).convert('RGB')
          im = im.resize((1260,1260), Image.Resampling.LANCZOS)
          im = ImageEnhance.Sharpness(im).enhance(1.45)
          im = ImageEnhance.Contrast(im).enhance(1.035)
          im = im.filter(ImageFilter.UnsharpMask(radius=1.6, percent=115, threshold=2))
          out = Path('assets/ji-kairo-duo-vivid-hq.png')
          im.save(out, format='PNG', optimize=True)

          css = Path('home.css')
          css_text = css.read_text(encoding='utf-8')
          old_ref = "assets/ji-kairo-duo-vivid-420.avif?v=20260825-0616"
          new_ref = "assets/ji-kairo-duo-vivid-hq.png"
          if css_text.count(old_ref) != 1:
            raise SystemExit(f'Expected one old mascot reference, found {css_text.count(old_ref)}')
          css.write_text(css_text.replace(old_ref, new_ref), encoding='utf-8')
          src.unlink()

          # Remove this one-shot workflow so no tooling residue remains in the branch.
          Path('.github/workflows/inspect-mascot.yml').unlink()
          PY

          test ! -e assets/ji-kairo-duo-vivid-420.avif
          test -e assets/ji-kairo-duo-vivid-hq.png
          ! grep -q 'ji-kairo-duo-vivid-420' home.css
          grep -q 'ji-kairo-duo-vivid-hq.png' home.css
          ! grep -q '과정을 검증하고' index.html
          ! grep -q '데이터를 비교해' index.html
          ! grep -q '핵심은 빠르게' index.html

          git config user.name 'sfandomsportji-cpu'
          git config user.email 'sfandomsportji@gmail.com'
          git add -A
          git commit -m 'Refresh home headings and sharpen mascot source'
          git push origin HEAD
