name: Inspect Mascot Sources

on:
  push:
    branches:
      - update/home-english-mascot-hq-20260828

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect mascot assets across design branches
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          import subprocess, io
          from PIL import Image
          refs=[
            'origin/design/final-ji-kairo-duo',
            'origin/design/ji-bear-kairo-duo',
            'origin/design/ji-kairo-duo',
            'origin/design/kairo-home-mobile-section',
            'origin/design/kairo-official-mascot',
            'origin/design/korean-kairo-refresh',
            'origin/design/single-kairo-appearance',
            'origin/layout/kairo-inline-introduction',
          ]
          for ref in refs:
            print(f'### {ref}')
            try:
              names=subprocess.check_output(['git','ls-tree','-r','--name-only',ref], text=True).splitlines()
            except Exception as e:
              print('REF ERROR',e); continue
            names=[n for n in names if n.startswith('assets/') and any(k in n.lower() for k in ['kairo','ji-','bear','mascot']) and n.lower().endswith(('.webp','.png','.jpg','.jpeg','.avif'))]
            if not names:
              print('NO MATCHING RASTER ASSETS')
            for f in names:
              try:
                data=subprocess.check_output(['git','show',f'{ref}:{f}'])
                try:
                  im=Image.open(io.BytesIO(data))
                  print(f'{f} | {im.width}x{im.height} | {len(data)} bytes | {im.mode}')
                except Exception:
                  print(f'{f} | DIMENSION-UNREADABLE | {len(data)} bytes')
              except Exception as e:
                print(f'{f} | ERROR | {e}')
          PY
