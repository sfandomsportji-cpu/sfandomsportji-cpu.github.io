name: Temporary validated audio refresh

on:
  push:
    branches:
      - audio-refresh-20260825

permissions:
  contents: write

jobs:
  build-playlist:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare audio tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 playwright
          python -m playwright install --with-deps chromium
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Resolve, download and validate five tracks
        run: |
          python - <<'PY'
          import json, os, re, subprocess, sys
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          from playwright.sync_api import sync_playwright

          tracks = [
              {
                  "file": "assets/music/sfandom-energy-01-danceable-funky-indie-pop.mp3",
                  "title": "Danceable Funky Indie Pop",
                  "full_title": "Upbeat Danceable Funky Indie Pop (Energetic Dance Funky Catchy)",
                  "artist": "Sound_For_You",
                  "source_page": "https://pixabay.com/music/funk-upbeat-danceable-funky-indie-pop-energetic-dance-funky-catchy-473869/",
              },
              {
                  "file": "assets/music/sfandom-energy-02-indie-pop-rock-funky-guitar.mp3",
                  "title": "Indie Pop Rock Funky Guitar",
                  "full_title": "Indie Pop Rock Funky Guitar (Fun Happy Youthful Catchy Indie Rock)",
                  "artist": "Sound_For_You",
                  "source_page": "https://pixabay.com/music/rock-indie-pop-rock-funky-guitar-fun-happy-youthful-catchy-indie-rock-475294/",
              },
              {
                  "file": "assets/music/sfandom-energy-03-uplifting-fun-indie-pop-rock.mp3",
                  "title": "Uplifting Fun Indie Pop Rock",
                  "full_title": "Uplifting Fun Indie Pop Rock (Funky Guitar Riff Fun Youthful Vibe)",
                  "artist": "Sound_For_You",
                  "source_page": "https://pixabay.com/music/acoustic-group-uplifting-fun-indie-pop-rock-funky-guitar-riff-fun-youthful-vibe-484929/",
              },
              {
                  "file": "assets/music/sfandom-energy-04-upbeat-party-pop.mp3",
                  "title": "Upbeat Party Pop",
                  "full_title": "Upbeat Party Pop (Energetic Indie Pop with catchy Guitars)",
                  "artist": "Sound_For_You",
                  "source_page": "https://pixabay.com/music/electronic-upbeat-party-pop-energetic-indie-pop-with-catchy-guitars-487926/",
              },
              {
                  "file": "assets/music/sfandom-energy-05-happy-indie-pop.mp3",
                  "title": "Happy Indie Pop",
                  "full_title": "Happy Indie Pop (Energetic Upbeat Uplifting Catchy Indie Pop)",
                  "artist": "Sound_For_You",
                  "source_page": "https://pixabay.com/music/acoustic-group-happy-indie-pop-energetic-upbeat-uplifting-catchy-indie-pop-487485/",
              },
          ]

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36",
              "Accept-Language": "en-US,en;q=0.9",
          }

          def find_content_url(obj):
              if isinstance(obj, dict):
                  cu = obj.get("contentUrl")
                  if isinstance(cu, str) and cu.startswith("http"):
                      return cu
                  for v in obj.values():
                      found = find_content_url(v)
                      if found:
                          return found
              elif isinstance(obj, list):
                  for v in obj:
                      found = find_content_url(v)
                      if found:
                          return found
              return None

          def resolve_static(url):
              r = requests.get(url, headers=headers, timeout=30)
              r.raise_for_status()
              soup = BeautifulSoup(r.text, "html.parser")
              for script in soup.find_all("script", attrs={"type": "application/ld+json"}):
                  raw = script.string or script.get_text() or ""
                  try:
                      data = json.loads(raw)
                  except Exception:
                      continue
                  found = find_content_url(data)
                  if found:
                      return found
              return None

          def resolve_browser(url, browser):
              page = browser.new_page(user_agent=headers["User-Agent"])
              try:
                  page.goto(url, wait_until="domcontentloaded", timeout=60000)
                  page.wait_for_timeout(2500)
                  scripts = page.locator('script[type="application/ld+json"]').all_text_contents()
                  for raw in scripts:
                      try:
                          data = json.loads(raw)
                      except Exception:
                          continue
                      found = find_content_url(data)
                      if found:
                          return found
                  return None
              finally:
                  page.close()

          Path("assets/music").mkdir(parents=True, exist_ok=True)
          session = requests.Session()
          session.headers.update(headers)
          browser = None
          pw = None
          reports = []

          try:
              for i, t in enumerate(tracks, 1):
                  print(f"Resolving {i}/5: {t['full_title']}")
                  audio_url = None
                  try:
                      audio_url = resolve_static(t["source_page"])
                  except Exception as e:
                      print("Static resolution warning:", e)

                  if not audio_url:
                      if pw is None:
                          pw = sync_playwright().start()
                          browser = pw.chromium.launch(headless=True)
                      audio_url = resolve_browser(t["source_page"], browser)

                  if not audio_url:
                      raise RuntimeError(f"No contentUrl found for {t['source_page']}")

                  out = Path(t["file"])
                  with session.get(audio_url, stream=True, timeout=90) as r:
                      r.raise_for_status()
                      with out.open("wb") as f:
                          for chunk in r.iter_content(chunk_size=1024 * 256):
                              if chunk:
                                  f.write(chunk)

                  size = out.stat().st_size
                  if size < 200_000:
                      raise RuntimeError(f"Audio file suspiciously small: {out} ({size} bytes)")

                  probe = subprocess.run(
                      ["ffprobe", "-v", "error", "-show_entries", "format=duration", "-of", "default=noprint_wrappers=1:nokey=1", str(out)],
                      capture_output=True, text=True, check=True,
                  )
                  duration = float(probe.stdout.strip())
                  if duration < 60 or duration > 600:
                      raise RuntimeError(f"Unexpected audio duration: {out} ({duration:.2f}s)")

                  reports.append({
                      **t,
                      "license": "Pixabay Content License",
                      "license_url": "https://pixabay.com/service/license-summary/",
                      "duration_seconds": round(duration, 2),
                      "size_bytes": size,
                  })
                  print(f"Validated: {out} — {duration:.2f}s — {size} bytes")
          finally:
              if browser is not None:
                  browser.close()
              if pw is not None:
                  pw.stop()

          if len(reports) != 5:
              raise RuntimeError(f"Expected 5 validated tracks, got {len(reports)}")

          Path("assets/music/sources.json").write_text(
              json.dumps(reports, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )

          js_path = Path("music-player.js")
          js = js_path.read_text(encoding="utf-8")
          new_tracks = """const tracks=[
    {src:'assets/music/sfandom-energy-01-danceable-funky-indie-pop.mp3',title:'Danceable Funky Indie Pop',artist:'Sound_For_You',source:'https://pixabay.com/music/funk-upbeat-danceable-funky-indie-pop-energetic-dance-funky-catchy-473869/'},
    {src:'assets/music/sfandom-energy-02-indie-pop-rock-funky-guitar.mp3',title:'Indie Pop Rock Funky Guitar',artist:'Sound_For_You',source:'https://pixabay.com/music/rock-indie-pop-rock-funky-guitar-fun-happy-youthful-catchy-indie-rock-475294/'},
    {src:'assets/music/sfandom-energy-03-uplifting-fun-indie-pop-rock.mp3',title:'Uplifting Fun Indie Pop Rock',artist:'Sound_For_You',source:'https://pixabay.com/music/acoustic-group-uplifting-fun-indie-pop-rock-funky-guitar-riff-fun-youthful-vibe-484929/'},
    {src:'assets/music/sfandom-energy-04-upbeat-party-pop.mp3',title:'Upbeat Party Pop',artist:'Sound_For_You',source:'https://pixabay.com/music/electronic-upbeat-party-pop-energetic-indie-pop-with-catchy-guitars-487926/'},
    {src:'assets/music/sfandom-energy-05-happy-indie-pop.mp3',title:'Happy Indie Pop',artist:'Sound_For_You',source:'https://pixabay.com/music/acoustic-group-happy-indie-pop-energetic-upbeat-uplifting-catchy-indie-pop-487485/'}
  ];"""
          patched, n = re.subn(r"const tracks=\[.*?\n  \];", new_tracks, js, count=1, flags=re.S)
          if n != 1:
              raise RuntimeError(f"Could not safely replace tracks block; replacements={n}")
          patched = patched.replace("sfandomMusicIndexV3", "sfandomMusicIndexV4")
          patched = patched.replace("sfandomMusicTimeV3", "sfandomMusicTimeV4")
          patched = patched.replace('<small id="sfMusicTitle">R&B</small>', '<small id="sfMusicTitle">FUNK POP</small>')
          js_path.write_text(patched, encoding="utf-8")

          print("All five tracks validated and player metadata patched.")
          PY

      - name: Verify only intended files changed
        run: |
          set -e
          changed="$(git status --short)"
          echo "$changed"
          test -f assets/music/sfandom-energy-01-danceable-funky-indie-pop.mp3
          test -f assets/music/sfandom-energy-02-indie-pop-rock-funky-guitar.mp3
          test -f assets/music/sfandom-energy-03-uplifting-fun-indie-pop-rock.mp3
          test -f assets/music/sfandom-energy-04-upbeat-party-pop.mp3
          test -f assets/music/sfandom-energy-05-happy-indie-pop.mp3
          python -m json.tool assets/music/sources.json >/dev/null
          grep -q "sfandom-energy-05-happy-indie-pop.mp3" music-player.js
          grep -q "sfandomMusicIndexV4" music-player.js

      - name: Commit validated playlist to review branch
        run: |
          set -e
          rm -f .github/workflows/audio-refresh-temp.yml
          git config user.name "sfandomsportji-cpu"
          git config user.email "sfandomsportji@gmail.com"
          git add music-player.js assets/music/sources.json assets/music/sfandom-energy-*.mp3 .github/workflows/audio-refresh-temp.yml
          git commit -m "Prepare validated five-track upbeat playlist"
          git push origin HEAD:audio-refresh-20260825
