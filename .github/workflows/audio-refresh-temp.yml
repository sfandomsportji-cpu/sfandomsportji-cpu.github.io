name: Temporary browser audio probe

on:
  push:
    branches: [audio-refresh-20260825]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install browser probe
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Resolve confirmed track
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from html import unescape
          from playwright.sync_api import sync_playwright

          url='https://pixabay.com/music/funk-upbeat-danceable-funky-indie-pop-energetic-dance-funky-catchy-473869/'
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(
                  user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36',
                  locale='en-US'
              )
              response=page.goto(url,wait_until='domcontentloaded',timeout=90000)
              print('HTTP_STATUS', response.status if response else None)
              page.wait_for_timeout(5000)
              html=page.content()
              print('TITLE', page.title())
              print('HTML_LEN', len(html))
              candidates=[]
              patterns=[
                  r'https://[^"\'<> ]+\.mp3[^"\'<> ]*',
                  r'"contentUrl"\s*:\s*"([^"]+)"',
                  r'<meta[^>]+(?:property|name)=["\'](?:og:audio|og:audio:url|og:audio:secure_url|twitter:player:stream)["\'][^>]+content=["\']([^"\']+)["\']'
              ]
              for pat in patterns:
                  for m in re.finditer(pat,html,re.I):
                      val=m.group(1) if m.lastindex else m.group(0)
                      val=unescape(val).replace('\\u0026','&').replace('\\/','/')
                      if val not in candidates:
                          candidates.append(val)
              for resource in page.evaluate("performance.getEntriesByType('resource').map(e=>e.name)"):
                  if '.mp3' in resource.lower() and resource not in candidates:
                      candidates.append(resource)
              print('CANDIDATE_COUNT',len(candidates))
              for c in candidates[:20]:
                  print('AUDIO_CANDIDATE',c[:1000])
              browser.close()
              if not candidates:
                  raise SystemExit('No browser audio candidate found')
          PY
