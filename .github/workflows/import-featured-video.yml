name: Compact featured video

on:
  push:
    paths:
      - '.github/workflows/import-featured-video.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compact-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Simplify featured video section
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          pattern = re.compile(
              r'    <section id="featured-reel-20260821".*?</section>\n\n(?=    <section class="section promise reveal">)',
              re.S,
          )
          block = '''    <section id="featured-reel-20260821" class="section reveal" aria-label="SFANDOM MLB Daily Highlights" style="padding-top:24px;padding-bottom:88px;">
      <div style="width:min(100%,520px);margin:0 auto;">
        <div style="position:relative;width:100%;aspect-ratio:9/16;background:#000;border:1px solid #2c2c2c;overflow:hidden;box-shadow:0 20px 70px rgba(0,0,0,.35);">
          <video controls playsinline preload="metadata" title="SFANDOM MLB Daily Highlights — 2026.08.21" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;"><source src="assets/sfandom-mlb-daily-2026-08-21.mp4?v=20260823-2" type="video/mp4"></video>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 2px 0;color:#8c8c8c;font-size:.72rem;letter-spacing:.12em;">
          <span>MLB DAILY</span><span>2026.08.21 KST</span>
        </div>
      </div>
    </section>

'''
          new_s, n = pattern.subn(block, s, count=1)
          if n != 1:
              raise SystemExit(f'Featured section replacement count: {n}')
          p.write_text(new_s, encoding='utf-8')
          PY

      - name: Commit compact layout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Simplify featured video layout"
          git push
