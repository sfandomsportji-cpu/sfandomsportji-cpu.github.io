name: QA Aug 30 exact-width render

# retry with viewport screenshots
on:
  push:
    branches:
      - content/morning-20260830-approved
    paths:
      - .github/workflows/qa-render-20260830.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout content branch
        uses: actions/checkout@v4
        with:
          ref: content/morning-20260830-approved
      - name: Start local site
        shell: bash
        run: |
          python3 -m http.server 8000 >/tmp/sfandom-http.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:8000/index.html >/dev/null
      - name: Install Selenium
        run: python3 -m pip install --user selenium
      - name: Run 1440 and 390 render QA
        run: python3 .github/scripts/qa_render_20260830.py
      - name: Commit QA screenshots for inspection
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa-render
          git commit -m 'Add temporary Aug 30 render QA evidence'
          git push origin HEAD:content/morning-20260830-approved
